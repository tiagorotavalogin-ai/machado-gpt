[project]
name = "machado-gpt"
version = "0.1.0"
description = "A small language model trained from scratch on the works of Machado de Assis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mwparserfromhell>=0.7.2",
    "numpy>=2.5.5",
    "pdfplumber>=0.11.10",
    "torch>=2.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/machado_gpt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# PyTorch CPU-only build for local stages (2-4); Colab provides its own GPU build.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
